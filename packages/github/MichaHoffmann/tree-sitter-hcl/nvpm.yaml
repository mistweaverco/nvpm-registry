# yaml-language-server: $schema=https://registry.nvpm.dev/package.schema.json
---
name: tree-sitter-hcl
description: Tree-sitter grammar for terraform.
homepage: https://github.com/MichaHoffmann/tree-sitter-hcl
licenses:
  - MIT
languages: []
categories:
  - Tree-sitter-parser
source:
  id: github:MichaHoffmann/tree-sitter-hcl
treesitter:
  build:
    - language: terraform
      grammar_dir: dialects/terraform
      integrations:
        - neovim
      external_queries:
        - repo_url: https://github.com/neovim-treesitter/nvim-treesitter-queries-terraform
          dialect: neovim
          semver: true
        - repo_url: https://github.com/neovim-treesitter/nvim-treesitter-queries-hcl
          dialect: neovim
          semver: true
    - language: hcl
      grammar_dir: dialects/terraform
      integrations:
        - neovim
      external_queries:
        repo_url: https://github.com/neovim-treesitter/nvim-treesitter-queries-hcl
        dialect: neovim
        semver: true
requires:
  one:
    - npm:tree-sitter-cli
    - github:tree-sitter/tree-sitter
