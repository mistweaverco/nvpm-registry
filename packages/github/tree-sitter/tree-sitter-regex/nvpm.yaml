# yaml-language-server: $schema=https://registry.nvpm.dev/package.schema.json
---
name: tree-sitter-regex
description: Tree-sitter grammar for regex.
homepage: https://github.com/tree-sitter/tree-sitter-regex
licenses:
  - MIT
languages:
  - regex
categories:
  - Tree-sitter-parser
source:
  id: github:tree-sitter/tree-sitter-regex
default_version: v0.25.0
treesitter:
  build:
    - language: regex
      grammar_dir: .
      integrations:
        - neovim
      external_queries:
        repo_url: https://github.com/neovim-treesitter/nvim-treesitter-queries-regex
        dialect: neovim
        semver: true
requires:
  one:
    - npm:tree-sitter-cli
    - github:tree-sitter/tree-sitter
